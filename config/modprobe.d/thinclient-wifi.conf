# ThinClient: stop the USB Wi-Fi power-management reset (rtl88xxau Runtime-PM
# underflow). Disables the driver's 802.11 power save + USB selective suspend.
options 8821au rtw_power_mgnt=0 rtw_enusbss=0
options 8812au rtw_power_mgnt=0 rtw_enusbss=0
options 88x2bu rtw_power_mgnt=0 rtw_enusbss=0
options rtw_8821au rtw_power_mgnt=0 rtw_enusbss=0
