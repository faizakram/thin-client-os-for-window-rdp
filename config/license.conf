# =============================================================================
#  ThinClient OS — device licensing / management
#  Location on target: /etc/thinclient/license.conf   (root:root, 0644)
#
#  Points the device at the control plane and controls enforcement. This is the
#  ONLY file to edit to enrol a device or turn licensing on.
# =============================================================================

# Control plane base URL (the ThinClient Manager). Deliberately blank in source:
# it is set at build time from TC_CONTROL_URL or the untracked config/build.local.env.
CONTROL_URL=

# LICENSE_ENFORCE=false -> the appliance works with NO licence check (fail-safe;
# nothing changes vs an unlicensed build). Set true only once the device is
# enrolled and you want the kill-switch active. When true and the device's
# licence is expired/suspended (or an admin lock is set), the connect window
# refuses to start an RDP session.
LICENSE_ENFORCE=false

# Human-friendly name shown in the Manager dashboard. Set by the installer
# prompt ("Device name for the dashboard"); if blank the agent uses the hostname.
# Sent when the device self-registers.
DEVICE_NAME=

# Tenant auto-enrol token — one per tenant. When set (and no ENROLL_CODE yet) the
# device self-registers into that tenant on first boot and receives its own
# per-device credentials below. Baked from the activation USB or the installer.
TENANT_TOKEN=

# Per-device enrolment — get these from the dashboard / API:
#   POST /api/devices/enroll  ->  { enroll_code, secret }
# Unique to each machine; set at install time (or auto-filled via TENANT_TOKEN).
ENROLL_CODE=
DEVICE_SECRET=

# Grace period (seconds) after a licence expires before the device hard-locks,
# so a brief server/network outage never bricks a paid machine. Default 3 days.
LICENSE_GRACE_SECONDS=259200

# Agent loop tuning. AGENT_POLL_SECONDS is the idle "spin mode" cadence (just a
# lightweight heartbeat + command check). AGENT_STREAM_SECONDS is the faster
# cadence used ONLY while an admin has the live stream turned on — capture never
# runs otherwise. AGENT_ENFORCE_SECONDS is the licence rotate/enforce interval.
AGENT_POLL_SECONDS=5
AGENT_STREAM_SECONDS=2
AGENT_ENFORCE_SECONDS=21600

# Screen capture (live view) — the local X display. XAUTHORITY is auto-detected
# from the running X server; set CAPTURE_XAUTHORITY only to override.
CAPTURE_DISPLAY=:0
