# =============================================================================
#  ThinClient OS  —  Administrator / Maintenance Configuration
#  Location on target system: /etc/thinclient/admin.conf   (root:root, 0600)
# =============================================================================
#
#  Controls access to the hidden Admin Mode and the GUI configuration tool.
#  The password is stored ONLY as a salted hash — never in plain text.
#
#  Set or change the admin password with:
#     sudo thinclient-adminctl set-password
#  (or, offline while building the image, run scripts/gen-admin-hash.sh)
# =============================================================================

# Salted password hash produced by `openssl passwd -6` (SHA-512 crypt).
# The default below is the factory password, shared by every unconfigured device.
# Set your account's own in the manager (account page -> Admin Mode password):
# each device replaces this line with it at its next check-in.
ADMIN_PASSWORD_HASH=$6$thinclient00$5UHjCgA9QSMdPfMykia8Q1Inye73MoramQDVWYJYjowv/v2EkMKT9FL7X6GlQ.bKRX3tq9e7Ecpky.ofVp.uz.

# Secret key combination that opens the Admin Mode prompt from the RDP session.
# Expressed in Openbox key syntax. Default: Ctrl+Alt+Shift+A
ADMIN_HOTKEY=C-A-S-a

# Maximum consecutive failed admin password attempts before a lockout.
ADMIN_MAX_ATTEMPTS=5
# Lockout duration in seconds after MAX_ATTEMPTS is reached.
ADMIN_LOCKOUT_SECONDS=300
