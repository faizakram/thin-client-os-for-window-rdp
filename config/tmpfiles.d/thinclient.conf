# ThinClient shared runtime signal directory. World-writable + sticky so the
# root agent (thinclient-agent) and the kiosk-user session scripts
# (thinclient-connect, thinclient-lock) can all drop their signal files here:
#   rdp-connected   — an RDP session is live      (activity: working hours)
#   locked          — the screen lock is up       (activity + recording overlay)
#   rec-overlay.txt — dynamic recording lock banner
d /run/thinclient 1777 root root -
