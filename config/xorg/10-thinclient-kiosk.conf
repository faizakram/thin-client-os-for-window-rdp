# =============================================================================
#  ThinClient OS — Xorg kiosk hardening
#  Installed to: /etc/X11/xorg.conf.d/10-thinclient-kiosk.conf
#
#  Locks down the X server itself so the user cannot escape the RDP session:
#    * DontVTSwitch  -> Ctrl+Alt+F1..F12 cannot switch to a text console
#    * DontZap       -> Ctrl+Alt+Backspace cannot kill the X server
#    * BlankTime 0 / no DPMS -> the screen never blanks to a black console
# =============================================================================

Section "ServerFlags"
    Option "DontVTSwitch"   "true"
    Option "DontZap"        "true"
    Option "BlankTime"      "0"
    Option "StandbyTime"    "0"
    Option "SuspendTime"    "0"
    Option "OffTime"        "0"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "Extensions"
    # DPMS off — never power the panel down into a Linux console.
    Option "DPMS" "Disable"
EndSection
